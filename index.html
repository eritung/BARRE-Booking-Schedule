<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出席確認表 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F7F3EE;
      --cream-dark: #EDE7DC;
      --ink: #1C1C1E;
      --ink-light: #555553;
      --sage: #6B8F71;
      --sage-light: #A8C4AC;
      --sage-pale: #E8F0E9;
      --vermillion: #C85250;
      --vermillion-pale: #FAEAEA;
      --gold: #C4973A;
      --gold-pale: #FBF3E3;
      --border: #D8D0C5;
      --shadow: rgba(28, 28, 30, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* ── Header ── */
    header {
      background: var(--ink);
      color: var(--cream);
      padding: 36px 40px 28px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 40px solid rgba(107, 143, 113, 0.18);
      pointer-events: none;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -30px; left: 180px;
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 20px solid rgba(196, 151, 58, 0.12);
      pointer-events: none;
    }
    .header-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--sage-light);
      font-weight: 500;
      margin-bottom: 8px;
    }
    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-weight: 900;
      font-size: clamp(24px, 5vw, 38px);
      line-height: 1.15;
      margin-bottom: 8px;
    }
    header p {
      font-size: 13px;
      color: rgba(247,243,238,0.55);
      font-weight: 300;
    }

    /* ── Main layout ── */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px 0;
    }

    /* ── Person selector ── */
    .selector-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .selector-card label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 10px;
    }
    .selector-wrapper {
      position: relative;
    }
    .selector-wrapper::after {
      content: '▾';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--ink-light);
      font-size: 14px;
    }
    select#person {
      width: 100%;
      appearance: none;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 40px 12px 16px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 500;
      background: var(--cream);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.2s;
      outline: none;
    }
    select#person:focus { border-color: var(--sage); }
    select#person option[value=""] { color: var(--ink-light); }

    /* ── Status bar ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      animation: fadeSlideIn 0.3s ease;
    }
    #status-bar.loading { background: var(--gold-pale); color: var(--gold); display: flex; }
    #status-bar.success { background: var(--sage-pale); color: var(--sage); display: flex; }
    #status-bar.error   { background: var(--vermillion-pale); color: var(--vermillion); display: flex; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .loading .status-dot { background: var(--gold); animation: pulse 1s infinite; }
    .success .status-dot { background: var(--sage); }
    .error .status-dot   { background: var(--vermillion); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Date picker section ── */
    .dates-section { display: none; }
    .dates-section.visible { display: block; animation: fadeSlideIn 0.35s ease; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 18px;
      font-weight: 600;
    }
    .section-hint {
      font-size: 12px;
      color: var(--ink-light);
    }

    /* Month group */
    .month-group {
      margin-bottom: 24px;
    }
    .month-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--sage);
      padding: 0 4px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .dates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    /* Date checkbox item */
    .date-item {
      position: relative;
    }
    .date-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }
    .date-item label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
      transition: all 0.18s ease;
      user-select: none;
    }
    .date-item label:hover {
      border-color: var(--sage-light);
      background: var(--sage-pale);
    }
    .date-item input:checked + label {
      border-color: var(--vermillion);
      background: var(--vermillion-pale);
      color: var(--vermillion);
    }
    .checkbox-box {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .date-item input:checked + label .checkbox-box {
      background: var(--vermillion);
      border-color: var(--vermillion);
    }
    .checkbox-box svg {
      display: none;
    }
    .date-item input:checked + label .checkbox-box svg {
      display: block;
    }
    .date-text {
      line-height: 1.3;
    }
    .date-main {
      font-size: 14px;
      font-weight: 500;
    }
    .date-sub {
      font-size: 11px;
      color: var(--ink-light);
      margin-top: 1px;
    }
    .date-item input:checked + label .date-sub {
      color: rgba(200, 82, 80, 0.7);
    }

    /* ── Summary bar ── */
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--ink);
      color: var(--cream);
      border-radius: 12px;
      padding: 14px 20px;
      margin: 24px 0;
      font-size: 14px;
    }
    .summary-count {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .count-badge {
      background: var(--vermillion);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      min-width: 24px;
      text-align: center;
    }

    /* ── Save button ── */
    #save-btn {
      width: 100%;
      padding: 16px;
      background: var(--sage);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    #save-btn:hover { background: #5a7a60; }
    #save-btn:active { transform: scale(0.98); }
    #save-btn:disabled {
      background: var(--border);
      color: var(--ink-light);
      cursor: not-allowed;
    }

    /* ── Overview panel ── */
    .overview-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-top: 32px;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .overview-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .overview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .overview-table th {
      text-align: left;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--ink-light);
      padding: 6px 8px;
      border-bottom: 1px solid var(--cream-dark);
    }
    .overview-table td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--cream-dark);
      vertical-align: top;
    }
    .overview-table tr:last-child td { border-bottom: none; }
    .person-name {
      font-weight: 500;
      white-space: nowrap;
      padding-right: 12px;
    }
    .date-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .date-chip {
      background: var(--vermillion-pale);
      color: var(--vermillion);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .no-absence {
      color: var(--ink-light);
      font-size: 12px;
      font-style: italic;
    }

    /* ── Overview tabs ── */
    .overview-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .overview-tab {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--cream);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-light);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .overview-tab.active {
      background: var(--ink);
      color: var(--cream);
      border-color: var(--ink);
    }

    /* ── Date-by-date view ── */
    .date-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 10px 8px;
      border-bottom: 1px solid var(--cream-dark);
    }
    .date-row:last-child { border-bottom: none; }
    .date-row-label {
      min-width: 52px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      padding-top: 2px;
      flex-shrink: 0;
    }
    .date-row-label small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--ink-light);
      margin-top: 1px;
    }
    .absence-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .absence-chip {
      background: var(--vermillion-pale);
      color: var(--vermillion);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .all-present {
      font-size: 12px;
      color: var(--sage);
      font-weight: 500;
      padding-top: 3px;
    }

    /* ── Config notice ── */
    .config-notice {
      background: var(--gold-pale);
      border: 1px solid rgba(196,151,58,0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 28px;
      font-size: 13px;
      line-height: 1.7;
      color: #7a5c1e;
    }
    .config-notice strong { font-weight: 600; }
    .config-notice code {
      background: rgba(196,151,58,0.15);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    .config-url-field {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .config-url-field input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid rgba(196,151,58,0.4);
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    .config-url-field input:focus { border-color: var(--gold); }
    .config-url-field button {
      padding: 9px 14px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <div class="header-label">Attendance Tracker · 2026</div>
  <h1>無法出席日期登記</h1>
  <p>請選擇您的名字，並勾選所有無法出席的開放日期</p>
</header>

<main>

  <!-- Person selector -->
  <div class="selector-card">
    <label for="person">現在填寫的是誰？</label>
    <div class="selector-wrapper">
      <select id="person" onchange="onPersonChange()">
        <option value="">── 請選擇 ──</option>
        <option>Sunny</option>
        <option>Jennifer</option>
        <option>巧雲</option>
        <option>巧雲姐</option>
        <option>Eri</option>
        <option>Irene</option>
        <option>Ally</option>
        <option>Jessica</option>
      </select>
    </div>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <div class="status-dot"></div>
    <span id="status-text"></span>
  </div>

  <!-- Dates section -->
  <div class="dates-section" id="dates-section">
    <div class="section-header">
      <div class="section-title">請勾選無法出席的日期</div>
      <div class="section-hint">7/27、7/29＋8–12 月每週三</div>
    </div>

    <div id="dates-container"></div>

    <div class="summary-bar">
      <div class="summary-count">
        已選取無法出席
        <span class="count-badge" id="count-badge">0</span>
        天
      </div>
      <div style="font-size:12px;opacity:0.6">點選儲存後生效</div>
    </div>

    <button id="save-btn" onclick="saveDates()">儲存我的回覆</button>
  </div>

  <!-- Overview -->
  <div class="overview-card" id="overview-card" style="display:none">
    <div class="overview-title">📋 出席狀況總覽</div>

    <div class="overview-tabs">
      <button class="overview-tab active" onclick="switchTab('person')">依成員</button>
      <button class="overview-tab" onclick="switchTab('date')">依日期</button>
    </div>

    <!-- 依成員 -->
    <div id="tab-person">
      <table class="overview-table">
        <thead>
          <tr>
            <th>成員</th>
            <th>無法出席日期</th>
          </tr>
        </thead>
        <tbody id="overview-body"></tbody>
      </table>
    </div>

    <!-- 依日期 -->
    <div id="tab-date" style="display:none">
      <div id="date-overview-body"></div>
    </div>
  </div>

</main>

<script>
  // ── Config ───────────────────────────────────────────────
  const PEOPLE = ['Sunny', 'Jessica', 'Eri', 'Irene', 'Jennifer', 'Ally', '巧雲', '巧雲姐'];
  const EXPECTED_SPREADSHEET_ID = '1bIXGJTm5rqydW_U1cjzgKa3Cmt7jcseAphwcRcvifrM';
  const EXPECTED_SHEET_ID = 905430503;
  const scriptUrl = 'https://script.google.com/macros/s/AKfycbzIKDK0BndFhVmWKP2UesCwWy-QQpJKnLJs9J_J9n7WL5PYdVPTYGYKaC7yVisjd7th/exec';
  let allData = {};

  // ── Generate Jul 27/29 plus Wednesdays from Aug through Dec 2026 ──
  function getAvailableDates() {
    const result = [
      new Date(2026, 6, 27, 12, 0, 0),
      new Date(2026, 6, 29, 12, 0, 0)
    ];
    const cursor = new Date(2026, 7, 4, 12, 0, 0);
    const end = new Date(2026, 11, 31, 12, 0, 0);
    while (cursor <= end) {
      if (cursor.getDay() === 3) result.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
    return result;
  }

  function formatDate(d) {
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `2026-${mm}-${dd}`;
  }

  function formatDisplay(d) {
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function formatWeekday(d) {
    return d.getDay() === 1 ? '週一' : '週三';
  }

  const MONTH_NAMES = {
    1: '一月 January', 2: '二月 February', 3: '三月 March',
    4: '四月 April', 5: '五月 May', 6: '六月 June',
    7: '七月 July', 8: '八月 August', 9: '九月 September',
    10: '十月 October', 11: '十一月 November', 12: '十二月 December'
  };
  const availableDates = getAvailableDates();

  // ── UI init ──────────────────────────────────────────────
  // DOM 一完成就開始抓資料，不等待字型與其他資源全部載完。
  document.addEventListener('DOMContentLoaded', async () => {
    buildDateGrid([]);
    await loadAllData();
  });

  // ── Build date grid ──────────────────────────────────────
  function buildDateGrid(checked) {
    const container = document.getElementById('dates-container');
    container.innerHTML = '';
    const groups = {};

    availableDates.forEach(d => {
      const month = d.getMonth() + 1;
      if (!groups[month]) groups[month] = [];
      groups[month].push(d);
    });

    Object.keys(groups).sort((a, b) => Number(a) - Number(b)).forEach(month => {
      const monthDiv = document.createElement('div');
      monthDiv.className = 'month-group';

      const label = document.createElement('div');
      label.className = 'month-label';
      label.textContent = MONTH_NAMES[month];
      monthDiv.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'dates-grid';

      groups[month].forEach(d => {
        const key = formatDate(d);
        const item = document.createElement('div');
        item.className = 'date-item';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = `date-${key}`;
        cb.value = key;
        cb.checked = checked.includes(key);
        cb.addEventListener('change', updateCount);

        const lbl = document.createElement('label');
        lbl.htmlFor = cb.id;
        lbl.innerHTML = `
          <div class="checkbox-box">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
              <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="date-text">
            <div class="date-main">${formatDisplay(d)}</div>
            <div class="date-sub">${formatWeekday(d)}</div>
          </div>`;

        item.appendChild(cb);
        item.appendChild(lbl);
        grid.appendChild(item);
      });

      monthDiv.appendChild(grid);
      container.appendChild(monthDiv);
    });

    updateCount();
  }

  function updateCount() {
    const checked = document.querySelectorAll('#dates-container input[type="checkbox"]:checked');
    document.getElementById('count-badge').textContent = checked.length;
  }

  function onPersonChange() {
    const person = document.getElementById('person').value;
    const section = document.getElementById('dates-section');
    if (!person) {
      section.classList.remove('visible');
      return;
    }
    buildDateGrid(allData[person] || []);
    section.classList.add('visible');
  }

  // ── API helper ───────────────────────────────────────────
  async function callApi(paramsObject) {
    if (!scriptUrl) throw new Error('尚未設定 Apps Script URL');

    const url = new URL(scriptUrl);
    Object.entries({ ...paramsObject, _: Date.now().toString() }).forEach(([key, value]) => {
      url.searchParams.set(key, String(value));
    });

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    let response;
    try {
      response = await fetch(url.toString(), {
        method: 'GET',
        cache: 'no-store',
        redirect: 'follow',
        signal: controller.signal
      });
    } catch (error) {
      if (error.name === 'AbortError') throw new Error('連線逾時，請確認 Web App 已部署且允許所有人存取');
      throw new Error(`無法連到 Apps Script：${error.message}`);
    } finally {
      clearTimeout(timeoutId);
    }

    const text = await response.text();
    let payload;
    try {
      payload = JSON.parse(text);
    } catch (error) {
      const preview = text.replace(/\s+/g, ' ').slice(0, 180);
      throw new Error(`後端沒有回傳 JSON。常見原因是權限或部署網址錯誤：${preview}`);
    }

    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    if (payload && payload.success === false) throw new Error(payload.error || '後端回報失敗');
    return payload;
  }

  function normalizeData(payload) {
    const source = payload && payload.success === true && payload.data ? payload.data : payload;
    const data = source && typeof source === 'object' ? { ...source } : {};
    const jennifer = Array.isArray(data.Jennifer) ? data.Jennifer : [];
    const lark = Array.isArray(data.Lark) ? data.Lark : [];
    data.Jennifer = [...new Set([...jennifer, ...lark])];
    delete data.Lark;
    PEOPLE.forEach(person => {
      if (!Array.isArray(data[person])) data[person] = [];
      data[person] = data[person].filter(date => /^2026-\d{2}-\d{2}$/.test(date));
    });
    return data;
  }

  async function loadAllData() {
    setStatus('loading', '正在讀取資料…');
    try {
      const payload = await callApi({ action: 'get' });
      if (payload.spreadsheetId !== EXPECTED_SPREADSHEET_ID) {
        throw new Error(`目前 Web App 綁到其他試算表：${payload.spreadsheetId || '未回傳 ID'}`);
      }
      if (Number(payload.sheetId) !== EXPECTED_SHEET_ID) {
        throw new Error(`目前 Web App 綁到錯誤分頁 gid：${payload.sheetId || '未回傳 gid'}`);
      }
      allData = normalizeData(payload);
      clearStatus();
      renderOverview();
      if (document.getElementById('person').value) onPersonChange();
    } catch (error) {
      setStatus('error', `讀取失敗：${error.message}`);
      console.error(error);
    }
  }

  function sameDates(a, b) {
    const left = [...a].sort();
    const right = [...b].sort();
    return left.length === right.length && left.every((value, index) => value === right[index]);
  }

  // ── Save dates and verify by reading them back ───────────
  async function saveDates() {
    const person = document.getElementById('person').value;
    if (!person) return;

    const checked = Array.from(
      document.querySelectorAll('#dates-container input[type="checkbox"]:checked')
    ).map(cb => cb.value).sort();

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    btn.textContent = '儲存中…';
    setStatus('loading', `正在儲存 ${person} 的資料…`);

    try {
      const payload = await callApi({ action: 'set', person, dates: checked.join(',') });
      const savedDates = Array.isArray(payload.dates) ? payload.dates : [];
      if (!sameDates(savedDates, checked)) {
        throw new Error('後端有回應，但寫入後驗證內容不一致');
      }

      // 後端已完成寫入後讀回驗證，前端直接更新該成員，省下一次完整下載。
      allData[person] = savedDates;
      setStatus('success', `✓ 已寫入並驗證！共選取 ${checked.length} 個無法出席日期`);
      renderOverview();
    } catch (error) {
      setStatus('error', `儲存失敗：${error.message}`);
      console.error(error);
    } finally {
      btn.disabled = false;
      btn.textContent = '儲存我的回覆';
    }
  }

  function switchTab(tab) {
    document.getElementById('tab-person').style.display = tab === 'person' ? 'block' : 'none';
    document.getElementById('tab-date').style.display = tab === 'date' ? 'block' : 'none';
    document.querySelectorAll('.overview-tab').forEach((el, i) => {
      el.classList.toggle('active', (i === 0 && tab === 'person') || (i === 1 && tab === 'date'));
    });
  }

  function renderOverview() {
    const card = document.getElementById('overview-card');
    const tbody = document.getElementById('overview-body');
    tbody.innerHTML = '';

    PEOPLE.forEach(person => {
      const dates = [...(allData[person] || [])].sort();
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.className = 'person-name';
      tdName.textContent = person;

      const tdDates = document.createElement('td');
      if (dates.length === 0) {
        tdDates.innerHTML = '<span class="no-absence">全程出席</span>';
      } else {
        const chips = document.createElement('div');
        chips.className = 'date-chips';
        dates.forEach(dateString => {
          const chip = document.createElement('span');
          chip.className = 'date-chip';
          const d = new Date(`${dateString}T00:00:00`);
          chip.textContent = `${d.getMonth() + 1}/${d.getDate()}`;
          chips.appendChild(chip);
        });
        tdDates.appendChild(chips);
      }

      tr.appendChild(tdName);
      tr.appendChild(tdDates);
      tbody.appendChild(tr);
    });

    const dateBody = document.getElementById('date-overview-body');
    dateBody.innerHTML = '';
    availableDates.forEach(d => {
      const key = formatDate(d);
      const absentPeople = PEOPLE.filter(person => (allData[person] || []).includes(key));
      const row = document.createElement('div');
      row.className = 'date-row';

      const label = document.createElement('div');
      label.className = 'date-row-label';
      label.innerHTML = `${d.getMonth() + 1}/${d.getDate()}<small>${formatWeekday(d)}</small>`;

      const right = document.createElement('div');
      right.className = 'absence-chips';
      if (absentPeople.length === 0) {
        right.innerHTML = '<span class="all-present">✓ 全員出席</span>';
      } else {
        absentPeople.forEach(person => {
          const chip = document.createElement('span');
          chip.className = 'absence-chip';
          chip.textContent = person;
          right.appendChild(chip);
        });
      }

      row.appendChild(label);
      row.appendChild(right);
      dateBody.appendChild(row);
    });

    card.style.display = 'block';
  }

  function setStatus(type, message) {
    const bar = document.getElementById('status-bar');
    bar.className = type;
    document.getElementById('status-text').textContent = message;
    bar.style.display = 'flex';
  }

  function clearStatus() {
    document.getElementById('status-bar').style.display = 'none';
  }
</script>
</body>
</html>
